server {
  listen 8081;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;
  location / {
      # A aplicação inteira é o index.html: o navegador confere a versão a cada acesso
      # (304 pelo ETag quando não mudou), senão segue com a antiga depois de um deploy.
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ /index.html =404;
  }
}
